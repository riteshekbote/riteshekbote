<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes scroll { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
      @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
      .matrix { animation: scroll 20s linear infinite; }
      .glow { animation: flicker 0.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="200" fill="#0d1117"/>
  <g class="matrix" fill="#FF6B6B" font-family="monospace" font-size="10" opacity="0.3">
    <text x="50" y="20">01001000 01100001 01100011 01101011</text>
    <text x="200" y="40">10110010 01010101 11010010 01101101</text>
    <text x="350" y="60">01101110 10101010 01010101 10110110</text>
    <text x="500" y="80">11010011 01101010 10101011 01010101</text>
    <text x="100" y="100">01010101 10110110 01101010 11010011</text>
    <text x="300" y="120">10101010 01010101 11010011 01101010</text>
    <text x="450" y="140">01101010 11010011 01010101 10101010</text>
    <text x="600" y="160">11010011 01101010 10101010 01010101</text>
    <text x="150" y="180">01010101 10101010 01101010 11010011</text>
  </g>
  <text x="400" y="105" fill="url(#grad)" font-family="monospace" font-size="40" text-anchor="middle" font-weight="bold" class="glow">RITESH EKBOTE</text>
  <text x="400" y="140" fill="#FF6B6B" font-family="monospace" font-size="14" text-anchor="middle" opacity="0.8">// SECURITY RESEARCHER</text>
</svg>
