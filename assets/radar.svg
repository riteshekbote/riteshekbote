<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      .radar-line { animation: rotate 3s linear infinite; transform-origin: 100px 100px; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: 0.3s; }
      .dot:nth-child(3) { animation-delay: 0.6s; }
      .dot:nth-child(4) { animation-delay: 0.9s; }
      .dot:nth-child(5) { animation-delay: 1.2s; }
      .text { animation: fadeIn 1s ease-in; }
    </style>
  </defs>
  <rect width="200" height="200" fill="#0d1117"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.3"/>
  <line class="radar-line" x1="100" y1="100" x2="100" y2="20" stroke="#FF6B6B" stroke-width="2"/>
  <circle class="dot" cx="70" cy="60" r="4" fill="#FF6B6B"/>
  <circle class="dot" cx="130" cy="80" r="3" fill="#FF6B6B"/>
  <circle class="dot" cx="90" cy="140" r="3" fill="#FF6B6B"/>
  <circle class="dot" cx="150" cy="120" r="2" fill="#FF6B6B"/>
  <circle class="dot" cx="60" cy="100" r="2" fill="#FF6B6B"/>
  <text class="text" x="100" y="195" fill="#FF6B6B" font-family="monospace" font-size="8" text-anchor="middle">SCANNING...</text>
</svg>
